    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      background: #0f172a;
      color: #fff;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .live-badge {
      background: #ef4444;
      color: #fff;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 999px;
      display: inline-block;
      margin: 10px auto;
      animation: blink 1.2s infinite;
      font-size: 14px;
      text-align: center;
      max-width: 100px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    main {
      flex: 1;
      max-width: 800px;
      margin: 20px auto 80px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .question-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .options {
      margin-bottom: 20px;
    }

    .option {
      background: #f1f5f9;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .option:hover {
      background: #e2e8f0;
    }

    .correct { background: #d1fae5; border: 1px solid #10b981; }
    .wrong { background: #fee2e2; border: 1px solid #ef4444; }

    .explanation {
      background: #fff7ed;
      padding: 10px 15px;
      border-left: 5px solid #f97316;
      border-radius: 5px;
      margin-top: 10px;
      display: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #3b82f6;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #2563eb;
    }

    .timer {
      font-size: 20px;
      font-weight: bold;
      color: #ef4444;
      margin-bottom: 15px;
    }

    .progress-container {
      width: 100%;
      height: 10px;
      background-color: #e5e7eb;
      border-radius: 5px;
      margin-bottom: 15px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background-color: #3b82f6;
      position: absolute;
      top: 0;
      left: 0;
      transition: width 1s linear;
    }

    .result-screen {
      text-align: center;
      padding: 30px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
    }

    .result-screen h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    footer {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 12px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

let current = 0, score = 0;
let startTime, endTime, timeTaken;
let timerValue = 15;
let timerInterval;

const testDetails = {
  testName: "UPSChub Live Poll",
  totalQuestions: quiz.length,
  quizDuration: 15 // Duration for each question (in minutes)
};

function startTimer() {
  clearInterval(timerInterval);
  timerValue = 15;
  document.getElementById('timer').textContent = `Time: ${timerValue}s`;
  document.getElementById('progressBar').style.width = "100%";

  timerInterval = setInterval(() => {
    timerValue--;
    document.getElementById('timer').textContent = `Time: ${timerValue}s`;
    document.getElementById('progressBar').style.width = (timerValue / 15) * 100 + "%";

    if (timerValue <= 0) {
      clearInterval(timerInterval);
      nextQuestion();
    }
  }, 1000);
}

function switchSection(sectionId) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(sectionId).classList.add('active');
}

function loadQuestion() {
  clearInterval(timerInterval);
  if (current === 0) startTime = new Date().toLocaleTimeString();

  const q = quiz[current];
  document.getElementById('question').textContent = `Q${current + 1}: ${q.question}`;
  const optionsContainer = document.getElementById('options');
  const explanationBox = document.getElementById('explanation');
  explanationBox.style.display = 'none';
  explanationBox.innerHTML = '';
  optionsContainer.innerHTML = '';

  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.onclick = () => handleAnswer(div, i === q.correct, q.correct, i);
    optionsContainer.appendChild(div);
  });

  startTimer();
}

function handleAnswer(elem, isCorrect, correctIndex, selectedIndex) {
  clearInterval(timerInterval);
  const all = document.querySelectorAll('.option');
  all.forEach((opt, idx) => {
    opt.classList.remove('correct', 'wrong');
    opt.onclick = null;
    if (idx === correctIndex) opt.classList.add('correct');
    else if (idx === selectedIndex) opt.classList.add('wrong');
  });
  if (isCorrect) score++;
  const exp = document.getElementById('explanation');
  exp.style.display = 'block';
  exp.innerHTML = `✔️ <b>Correct:</b> ${quiz[current].options[quiz[current].correct]}<br>📘 ${quiz[current].explanation}`;
}

function nextQuestion() {
  clearInterval(timerInterval);
  if (current < quiz.length - 1) {
    current++;
    loadQuestion();
  } else {
    endTime = new Date().toLocaleTimeString();
    timeTaken = (15 - timerValue); // Time taken for the last question
    
    const resultText = `🎉 I just completed the **${testDetails.testName}** quiz! 📝 Test Name: **${testDetails.testName}**. ⏰ Started at **${startTime}** and completed at **${endTime}**. I scored **${score}** out of **${testDetails.totalQuestions}** in **${timeTaken}** seconds. Test Details: **Total Questions**: ${testDetails.totalQuestions}, **Quiz Duration**: ${testDetails.quizDuration} minutes. Check it out and try it yourself!`;

    document.getElementById('resultText').textContent = `You scored ${score} out of ${testDetails.totalQuestions}.`;

    document.getElementById('shareButton').onclick = function () {
      const whatsappURL = `whatsapp://send?text=${encodeURIComponent(resultText)}`;
      window.location.href = whatsappURL;
    };

    switchSection('resultSection');
  }
}

window.onload = loadQuestion;
