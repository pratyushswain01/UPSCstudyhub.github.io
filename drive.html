  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    .full-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .header {
      background-color: #1a73e8;
      color: white;
      padding: 1rem;
      font-size: 1.2rem;
      text-align: center;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .footer {
      background-color: #eee;
      text-align: center;
      padding: 0.8rem;
      font-size: 0.85rem;
    }
  </style>
<style id="apple-liquid-glass">
/* ============================================
   APPLE LIQUID GLASS DESIGN SYSTEM
   Frosted glass Â· Backdrop blur Â· Soft depth
   ============================================ */

:root {
    --glass-bg: rgba(255, 255, 255, 0.72);
    --glass-bg-strong: rgba(255, 255, 255, 0.85);
    --glass-bg-soft: rgba(255, 255, 255, 0.45);
    --glass-border: rgba(255, 255, 255, 0.55);
    --glass-border-dark: rgba(0, 0, 0, 0.08);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
    --glass-shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.12);
    --apple-blue: #0071e3;
    --apple-blue-glow: rgba(0, 113, 227, 0.35);
    --apple-text: #1d1d1f;
    --apple-secondary: #86868b;
    --apple-bg: #f5f5f7;
    --blur: 24px;
    --blur-strong: 40px;
}

html {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    -webkit-font-smoothing: antialiased;
}

body {
    background: linear-gradient(160deg, #e8eef8 0%, #f5f5f7 40%, #f0f4fa 100%) !important;
    background-attachment: fixed !important;
    color: var(--apple-text) !important;
    letter-spacing: -0.015em !important;
    min-height: 100vh;
}

/* ===== LIQUID GLASS CORE ===== */
.glass, .apple-glass,
header, #sidebar, footer,
.bg-white, .dark\:bg-ink-800, .dark\:bg-ink-900,
#auth-container, .modal, [class*="rounded-2xl"].bg-white,
#main-content .bg-white {
    background: var(--glass-bg) !important;
    backdrop-filter: saturate(180%) blur(var(--blur)) !important;
    -webkit-backdrop-filter: saturate(180%) blur(var(--blur)) !important;
    border: 1px solid var(--glass-border) !important;
    box-shadow: var(--glass-shadow) !important;
}

.glass-strong {
    background: var(--glass-bg-strong) !important;
    backdrop-filter: saturate(180%) blur(var(--blur-strong)) !important;
    -webkit-backdrop-filter: saturate(180%) blur(var(--blur-strong)) !important;
}

.glass-soft {
    background: var(--glass-bg-soft) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
}

/* ===== GLASS BUTTONS (Liquid style) ===== */
.apple-btn, button[type="submit"],
.bg-blue-600, .bg-indigo-600, .brand-gradient-bg,
button.bg-blue-600, a.bg-blue-600 {
    background: linear-gradient(180deg, rgba(0, 113, 227, 0.95) 0%, rgba(0, 99, 200, 0.98) 100%) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255, 255, 255, 0.25) !important;
    border-radius: 980px !important;
    box-shadow:
        0 4px 16px var(--apple-blue-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1px 0 rgba(0, 0, 0, 0.1) !important;
    color: #fff !important;
    font-weight: 500 !important;
    letter-spacing: -0.01em !important;
    transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1) !important;
    position: relative;
    overflow: hidden;
}

.apple-btn:hover, button[type="submit"]:hover,
.bg-blue-600:hover, .bg-indigo-600:hover {
    transform: scale(1.03) translateY(-1px) !important;
    box-shadow:
        0 8px 28px var(--apple-blue-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
}

.apple-btn:active, button[type="submit"]:active {
    transform: scale(0.98) !important;
}

.apple-btn-secondary, .btn-secondary {
    background: rgba(255, 255, 255, 0.55) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
    border: 1px solid rgba(0, 0, 0, 0.08) !important;
    border-radius: 980px !important;
    color: var(--apple-blue) !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.8) !important;
}

/* ===== SIDEBAR GLASS ===== */
#sidebar {
    background: rgba(255, 255, 255, 0.65) !important;
    backdrop-filter: saturate(180%) blur(30px) !important;
    -webkit-backdrop-filter: saturate(180%) blur(30px) !important;
    border-right: 1px solid rgba(255, 255, 255, 0.5) !important;
    box-shadow: 4px 0 24px rgba(0,0,0,0.04) !important;
}

.sidebar-link {
    border-radius: 12px !important;
    transition: all 0.2s ease !important;
}

.sidebar-link.active {
    background: rgba(0, 113, 227, 0.12) !important;
    color: var(--apple-blue) !important;
    box-shadow: inset 0 0 0 1px rgba(0, 113, 227, 0.2) !important;
    backdrop-filter: blur(8px) !important;
}

/* ===== HEADER / NAV GLASS ===== */
header {
    background: rgba(255, 255, 255, 0.7) !important;
    backdrop-filter: saturate(180%) blur(20px) !important;
    -webkit-backdrop-filter: saturate(180%) blur(20px) !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.4) !important;
}

/* ===== CARDS ===== */
.rounded-2xl, .rounded-xl, .rounded-3xl {
    border-radius: 20px !important;
}

#main-content .bg-white,
.shadow-soft, .shadow-softer, .shadow-glow {
    background: rgba(255, 255, 255, 0.7) !important;
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
    border: 1px solid rgba(255, 255, 255, 0.6) !important;
    box-shadow: var(--glass-shadow) !important;
}

/* ===== WELCOME BANNER ===== */
#welcome-banner {
    background: linear-gradient(135deg, rgba(29, 29, 31, 0.92) 0%, rgba(45, 45, 47, 0.88) 100%) !important;
    backdrop-filter: blur(30px) !important;
    -webkit-backdrop-filter: blur(30px) !important;
    border-radius: 24px !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    box-shadow: var(--glass-shadow-lg) !important;
    overflow: hidden;
}

#welcome-banner h1, #welcome-banner h2, #welcome-banner h3,
#welcome-banner .text-slate-800 {
    color: #f5f5f7 !important;
}

#welcome-banner p {
    color: #a1a1a6 !important;
}

#welcome-banner .starfield,
#welcome-banner .glow-orb {
    opacity: 0.4 !important;
}

/* ===== INPUTS (glass) ===== */
input, select, textarea, .apple-input {
    background: rgba(255, 255, 255, 0.6) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(0, 0, 0, 0.08) !important;
    border-radius: 14px !important;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.04) !important;
    transition: all 0.2s ease !important;
}

input:focus, select:focus, textarea:focus, .apple-input:focus {
    background: rgba(255, 255, 255, 0.9) !important;
    border-color: var(--apple-blue) !important;
    box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.18), inset 0 1px 2px rgba(0,0,0,0.04) !important;
    outline: none !important;
}

/* ===== TABS / PILLS ===== */
.tab-active {
    background: rgba(0, 113, 227, 0.9) !important;
    backdrop-filter: blur(8px) !important;
    border-radius: 980px !important;
    box-shadow: 0 4px 12px var(--apple-blue-glow) !important;
    color: #fff !important;
}

/* ===== MODAL GLASS ===== */
.modal-backdrop {
    background: rgba(0, 0, 0, 0.35) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
}

/* ===== FOOTER NAV ===== */
.footer-nav a.nav-active {
    color: var(--apple-blue) !important;
}
.footer-nav a.nav-active .nav-icon-wrap {
    background: rgba(0, 113, 227, 0.9) !important;
    box-shadow: 0 4px 12px var(--apple-blue-glow) !important;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }

/* ===== TYPOGRAPHY ===== */
h1, h2, h3, .text-2xl, .text-3xl, .text-4xl {
    letter-spacing: -0.025em !important;
    font-weight: 600 !important;
}

.brand-gradient-text {
    background: none !important;
    -webkit-background-clip: unset !important;
    color: var(--apple-blue) !important;
}

/* ===== DARK MODE GLASS ===== */
.dark body, body.dark {
    background: linear-gradient(160deg, #0a0a0c 0%, #1c1c1e 50%, #121214 100%) !important;
}
.dark header, .dark #sidebar, .dark .bg-white {
    background: rgba(28, 28, 30, 0.75) !important;
    border-color: rgba(255, 255, 255, 0.08) !important;
}
.dark input, .dark select, .dark textarea {
    background: rgba(44, 44, 46, 0.7) !important;
    color: #f5f5f7 !important;
}

.confetti-piece { display: none !important; }

[style*="B99A59"], .text-amber-600, .text-yellow-600 {
    color: var(--apple-blue) !important;
}
</style>
