    <script>
        function redirectToGoogleForm() {
            const datePicker = document.getElementById('date-picker');
            const selectedDate = new Date(datePicker.value);

            if (selectedDate.toString() !== 'Invalid Date') {
                const year = selectedDate.getFullYear();
                const month = (selectedDate.getMonth() + 1).toString().padStart(2, '0'); // Add leading zero
                const day = selectedDate.getDate().toString().padStart(2, '0'); // Add leading zero
                const formattedDate = `${year}-${month}-${day}`;

                // Check if the selected date is the allowed one
                const allowedDate = '2025-01-10'; // Replace with the specific date you want to allow
                if (formattedDate === allowedDate) {
                    const googleFormUrl = "https://forms.gle/UshLL6WsoTHWzjvm7"; // Replace with your Google Form URL
                    window.location.href = googleFormUrl;
                } else {
                    alert(`The selected date (${formattedDate}) is not valid for redirection. Please select ${allowedDate}.`);
                }
            } else {
                alert('Please select a valid date.');
            }
        }

        // Digital clock function
        function updateClock() {
            const clockElement = document.getElementById('clock');
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const date = now.toLocaleDateString();

            clockElement.textContent = `${hours}:${minutes}:${seconds} ${date}`;
        }

        setInterval(updateClock, 1000); // Update the clock every second
    </script>
