header, #sidebar, footer,

#auth-container, .modal, [class*="rounded-2xl"].bg-white,

.glass-soft {

/* ===== GLASS BUTTONS (Liquid style) ===== */

    <header class="app-header">
    <h1>Current affairs test result </h1>
    <div class="result-container">
        <!-- Summary Table: Total Marks and Percentage -->
        <div class="summary-table">
            <table>
                <thead>
                    <tr>
                        <th>Total Marks</th>
                        <th>Percentage</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="totalMarks"></td>
                        <td id="percentage" class="percentage"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Answer Key Table: Questions and Answers -->
        <div class="questions-table">
            <table>
                <thead>
                    <tr>
                        <th>Question</th>
                        <th>Correct Answer</th>
                    </tr>
                </thead>
                <tbody id="answerKey"></tbody>
            </table>
        </div>

        <!-- OK Button -->
        <div id="okButtonContainer">
            <button id="okButton" class="ok-button" onclick="redirectToHomepage()">OK</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>Created by UPSChub, All Rights Reserved</p>
    </footer>

    <script>
        // Get query parameters
        const params = new URLSearchParams(window.location.search);
        const score = params.get('score');
        const total = params.get('total');

        // Answer key for the questions with correct answers displayed directly
        const questions = [
            "Who is the current chairman of the UN General Assembly?",
            "Which country recently launched the 'Mission Artemis'?",
            "What is the capital of Australia?"
        ];

        const answers = [
            'Abdullah Shahid',
            'USA',
            'Canberra'
        ];

        // Fill in the answer key table
        const answerKeyTable = document.getElementById('answerKey');
        questions.forEach((question, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${question}</td>
                <td>${answers[index]}</td>
            `;
            answerKeyTable.appendChild(row);
        });

        // Calculate percentage and display results
        const totalMarks = score;
        const percentage = (score / total) * 100;
        document.getElementById('totalMarks').textContent = totalMarks + ' / ' + total;
        document.getElementById('percentage').textContent = percentage.toFixed(2) + ' %';

        // Redirect directly to the homepage after clicking OK
        function redirectToHomepage() {
            window.location.href = "homeUPSChub.html"; // Redirect to homeUPSChub.html
        }
    </script>
</body>
