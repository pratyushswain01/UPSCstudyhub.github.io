
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Entrance Test Login</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body and background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: linear-gradient(to right, #6a11cb, #2575fc);
        }

        /* Login container */
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .login-container:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            transform: translateY(-10px);
        }

        h2 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }

        /* Form fields */
        label {
            font-size: 14px;
            color: #333;
            text-align: left;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #2575fc;
            box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #2575fc;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            background-color: #6a11cb;
            transform: scale(1.05);
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #333;
        }

        .footer a {
            color: #2575fc;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
<style id="apple-liquid-glass">
/* ============================================
   APPLE LIQUID GLASS DESIGN SYSTEM
   Frosted glass Â· Backdrop blur Â· Soft depth
   ============================================ */

:root {
    --glass-bg: rgba(255, 255, 255, 0.72);
    --glass-bg-strong: rgba(255, 255, 255, 0.85);
    --glass-bg-soft: rgba(255, 255, 255, 0.45);

    --apple-blue-glow: rgba(0, 113, 227, 0.35);
    --apple-text: #1d1d1f;

}

body {

}

header, #sidebar, footer,
.bg-white, .dark\:bg-ink-800, .dark\:bg-ink-900,
#auth-container, .modal, [class*="rounded-2xl"].bg-white,
#main-content .bg-white {

}

.glass-strong {
    background: var(--glass-bg-strong) !important;
    backdrop-filter: saturate(180%) blur(var(--blur-strong)) !important;
    -webkit-backdrop-filter: saturate(180%) blur(var(--blur-strong)) !important;
}

.glass-soft {
    background: var(--glass-bg-soft) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
}

/* ===== GLASS BUTTONS (Liquid style) ===== */
.apple-btn, button[type="submit"],
.bg-blue-600, .bg-indigo-600, .brand-gradient-bg,
button.bg-blue-600, a.bg-blue-600 {

.apple-btn:hover, button[type="submit"]:hover,

#sidebar {

    <header class="app-header">
    <div class="login-container">
        <h2>Login to Entrance Test</h2>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
            <p class="error" id="error-message"></p>
        </form>
        <div class="footer">
            <p>Dont have user id and password <a href="https://wa.me/8658567727?text=Hello%20admin%0A%0ACan%20you%20please%20share%20the%20user%20ID%20and%20password%20for%20the%20entrance%20test%3F%20Thank%20you%21" target="_blank">Click here</a></p>
        </div>
    </div>

    <script>
        // Constant Username and Password
        const validUsername = "upschub";
        const validPassword = "upsc2013";

        // Handle form submission
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            // Get the username and password from input
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Check if the entered credentials match the constant ones
            if (username === validUsername && password === validPassword) {
                // Redirect to the dashboard page on successful login
                window.location.href = "questionentrance.html";  // Change this to your actual redirect page
            } else {
                document.getElementById("error-message").innerText = "Invalid username or password.";
            }
        });
    </script>
