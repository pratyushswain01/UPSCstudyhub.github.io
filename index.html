<!-- ====================== PRATYUSH DEBUG SYSTEM ====================== -->
<!-- 2026 @ Pratyush.dev inc -->
<script>
const DEBUG_SECRET = "debug@2026";

async function checkDebugStatus() {
  try {
    const res = await fetch('/debug-mode.json?t=' + Date.now());
    if (!res.ok) return false;
    const data = await res.json();
    return data.enabled === true;
  } catch (e) {
    return false;
  }
}

async function openDebugPanel() {
  const isAllowed = await checkDebugStatus();
  if (!isAllowed) {
    alert("Debug Mode is currently OFF.\nEnable it from PowerShell first.");
    return;
  }

  const code = prompt("Enter Debug Secret Code:");
  if (code !== DEBUG_SECRET) {
    alert("Access Denied");
    return;
  }

  if (document.getElementById("pratyush-debug-panel")) return;

  const panel = document.createElement("div");
  panel.id = "pratyush-debug-panel";
  panel.innerHTML = `
    <div style="
      position: fixed; bottom: 20px; right: 20px; z-index: 999999;
      background: #0a0a0a; color: #00ff88; padding: 18px; border-radius: 14px;
      font-family: monospace; font-size: 13px; width: 300px;
      box-shadow: 0 0 25px rgba(0,255,136,0.3); border: 1px solid #00ff88;">
      <div style="font-weight:bold; color:#00ffff; margin-bottom:10px;">
        🔧 DEBUG MODE ACTIVE
        <div style="font-size:11px; color:#888;">2026 @ Pratyush.dev inc</div>
      </div>
      <button onclick="copyFcmToken()" style="margin:4px 0; width:100%; padding:6px;">Copy FCM Token</button>
      <button onclick="location.reload()" style="margin:4px 0; width:100%; padding:6px;">Force Reload</button>
      <button onclick="document.getElementById('pratyush-debug-panel').remove()" style="margin:4px 0; width:100%; padding:6px;">Close Panel</button>
    </div>
  `;
  document.body.appendChild(panel);
}

function copyFcmToken() {
  const token = window.currentFcmToken || localStorage.getItem("fcmToken") || "No token found";
  navigator.clipboard.writeText(token);
  alert("FCM Token copied!");
}

document.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "d") {
    openDebugPanel();
  }
});

window.enablePratyushDebug = openDebugPanel;
</script>
