<script id="ug-early-lockdown">
(function(){
  var id="ug-early-lockdown-cover";
  var style="position:fixed;inset:0;z-index:2147483646;background:#0b1424;color:#f5f7fb;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:14px system-ui,sans-serif";
  var cover=document.createElement("div");
  cover.id=id;
  cover.setAttribute("style",style);
  cover.innerHTML='<div><div style="font-size:12px;letter-spacing:3px;color:#d8b477">UPSC GURUKUL</div><div style="font-size:25px;font-weight:700;margin:18px 0 10px">Preparing your experience</div><div style="color:#9aabc1">Checking platform status…</div><div style="font-size:11px;color:#718198;margin-top:28px">2026 @ Pratyush.dev inc</div></div>';

  function mount(){
    if(settled) return;
    if(!document.getElementById(id)){
      (document.body||document.documentElement).appendChild(cover);
    }
  }
  mount();
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",mount,{once:true});
  }

var settled=false;
  function drop(){ if(!settled){ settled=true; cover.remove(); } }
  var ctl=window.AbortController?new AbortController():null;
  var timer=setTimeout(function(){ if(ctl) ctl.abort(); drop(); },2500);

  fetch("/debug-mode.json?t="+Date.now(),{cache:"no-store",signal:ctl?ctl.signal:undefined})
    .then(function(r){ if(!r.ok) throw Error("status"); return r.json(); })
    .then(function(data){
      clearTimeout(timer);
      if(data && data.enabled===true){
        var parts=cover.querySelectorAll("div div");
        if(parts[1]) parts[1].textContent="Development environment";
        if(parts[2]) parts[2].textContent="Loading official development portal…";
      }else{ drop(); }
    })
    .catch(function(){ clearTimeout(timer); drop(); console.warn("UPSC Gurukul: debug-mode check failed; continuing in public mode."); });
})();
</script>

  <style>

    /* ---------- Animated code emblem ---------- */
    .emblem { position: relative; width: clamp(130px, 34vw, 176px); aspect-ratio: 1; }

      background: radial-gradient(circle, rgba(214,173,83,.38), transparent 62%); opacity: 0; animation: glow-in 1s ease forwards .45s, breathe 3.2s ease-in-out infinite 1.6s; }
    .draw { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; }

    /* Installed app: native splash feel */

    html.app-mode body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }

    @media (prefers-reduced-motion: reduce) {
      .draw { stroke-dashoffset: 0 !important; animation: none !important; }

    /* ===== v5: user logo + PowerShell terminal ===== */
    .logo-img { position: absolute; left: 15%; top: 15%; width: 70%; height: 70%; object-fit: contain; border-radius: 24%;

    @keyframes logo-in { to { opacity: 1; transform: scale(1); filter: blur(0); } }
    .terminal { background: rgba(1,30,72,.86); border-color: rgba(120,170,255,.28); }

  </style>

  <script>
    (function () {
      var TARGET = 'homeUPSChub.html';
      var body = document.getElementById('introBody');
      var tBody = document.getElementById('tBody');
      var tBar = document.getElementById('tProgress');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var go = false, timers = [];

      function dest(extra) { return TARGET + window.location.search + (extra === undefined ? window.location.hash : extra); }
      function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }

      function leave() {
        if (go) return; go = true;
        timers.forEach(clearTimeout);
        body.classList.add('page-exit');
        setTimeout(function () { window.location.replace(dest()); }, 450);
      }

      // Links keep query (e.g. app_version) so the dashboard knows it's inside the app
      document.getElementById('enterBtn').href = dest('');
      document.getElementById('getAppBtn').href = TARGET + window.location.search + '#download';
      document.getElementById('enterBtn').addEventListener('click', function (e) { e.preventDefault(); leave(); });
      document.getElementById('skipBtn').addEventListener('click', leave);

      /* Drifting code glyphs in the background */
      var bg = document.getElementById('bg');
      if (!reduce) {
        var chars = ['{ }', '</>', '( )', '[ ]', '=>', ';', '01', '&&', '//', '#'];
        for (var i = 0; i < 14; i++) {
          var g = document.createElement('span');
          g.className = 'glyph';
          g.textContent = chars[i % chars.length];
          g.style.left = (Math.random() * 96) + '%';
          g.style.fontSize = (14 + Math.random() * 22) + 'px';
          g.style.animationDuration = (9 + Math.random() * 10) + 's';
          g.style.animationDelay = (-Math.random() * 14) + 's';
          bg.appendChild(g);
        }
      }

      /* PowerShell-style terminal */
      var PROMPT = 'PS C:\\UPSC-Gurukul> ';
      var script = [
        { type: 'cmd',    segs: [[PROMPT, 'ps'], ['.\\start-gurukul.ps1', 'cm']] },
        { type: 'out',    segs: [['[ OK ] ', 'ok'], ['Notes, tests & current affairs loaded', 'tx']] },
        { type: 'out',    segs: [['[ OK ] ', 'ok'], ['AI answer feedback online', 'tx']] },
        { type: 'out',    segs: [['Welcome, aspirant. Let\u2019s begin.', 'wl']] },
        { type: 'prompt', segs: [[PROMPT, 'ps']] }
      ];
      var caret = document.createElement('span'); caret.className = 'caret';

      function addSeg(row, seg, text) {
        var sp = document.createElement('span'); sp.className = seg[1]; sp.textContent = text === undefined ? seg[0] : text;
        row.insertBefore(sp, caret.parentNode === row ? caret : null); return sp;
      }
      function progress(i) { tBar.style.width = Math.round(((i + 1) / script.length) * 62) + '%'; }

      function run(i) {
        if (go) return;
        if (i >= script.length) { finish(); return; }
        var it = script[i], row = document.createElement('span'); row.className = 't-line';
        tBody.appendChild(row);
        if (it.type !== 'cmd') {
          it.segs.forEach(function (sg) { addSeg(row, sg); });
          if (it.type === 'prompt') row.appendChild(caret);
          progress(i); later(function () { run(i + 1); }, it.type === 'prompt' ? 0 : 210); return;
        }
        addSeg(row, it.segs[0]); row.appendChild(caret);
        var cmdSeg = it.segs[1], span = addSeg(row, cmdSeg, ''), n = 0;
        (function step() {
          if (go) return;
          span.textContent += cmdSeg[0].charAt(n++);
          if (n >= cmdSeg[0].length) { caret.remove(); progress(i); later(function () { run(i + 1); }, 320); return; }
          later(step, 24 + Math.random() * 20);
        })();
      }

      function finish() {
        body.classList.add('ready');
        tBar.style.transition = 'width 1.8s linear';
                tBar.style.width = '100%';
        body.classList.add('ready');
        later(leave, 1500);
      } else {

      if (reduce) {
        script.forEach(function (it) {
          var row = document.createElement('span'); row.className = 't-line';
          it.segs.forEach(function (sg) { var sp = document.createElement('span'); sp.className = sg[1]; sp.textContent = sg[0]; row.appendChild(sp); });
          tBody.appendChild(row);
        });
                tBar.style.width = '100%';

  <script>
  const DEBUG_SECRET = "debug@2026";

  async function checkDebugStatus() {
    try {
      const res = await fetch('/debug-mode.json?t=' + Date.now());
      if (!res.ok) return false;
      const data = await res.json();
      return data.enabled === true;
    } catch (e) {
      return false;
    }
  }

  async function openDebugPanel() {
    const isAllowed = await checkDebugStatus();
    if (!isAllowed) {
      alert("Debug Mode is currently OFF.\nEnable it from PowerShell first.");
      return;
    }

    const code = prompt("Enter Debug Secret Code:");
    if (code !== DEBUG_SECRET) {
      alert("Access Denied");
      return;
    }

    if (document.getElementById("pratyush-debug-panel")) return;

    const panel = document.createElement("div");
    panel.id = "pratyush-debug-panel";
    panel.innerHTML = `
      <div style="
        position: fixed; bottom: 20px; right: 20px; z-index: 999999;
        background: #0a0a0a; color: #00ff88; padding: 18px; border-radius: 14px;
        font-family: monospace; font-size: 13px; width: 300px;
        box-shadow: 0 0 25px rgba(0,255,136,0.3); border: 1px solid #00ff88;">
        <div style="font-weight:bold; color:#00ffff; margin-bottom:10px;">
          🔧 DEBUG MODE ACTIVE
          <div style="font-size:11px; color:#888;">2026 @ Pratyush.dev inc</div>
        </div>
        <button onclick="copyFcmToken()" style="margin:4px 0; width:100%; padding:6px;">Copy FCM Token</button>
        <button onclick="location.reload()" style="margin:4px 0; width:100%; padding:6px;">Force Reload</button>
        <button onclick="document.getElementById('pratyush-debug-panel').remove()" style="margin:4px 0; width:100%; padding:6px;">Close Panel</button>
      </div>
    `;
    document.body.appendChild(panel);
  }

  function copyFcmToken() {
    const token = window.currentFcmToken || localStorage.getItem("fcmToken") || "No token found";
    navigator.clipboard.writeText(token);
    alert("FCM Token copied!");
  }

  document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "d") {
      openDebugPanel();
    }
  });

  window.enablePratyushDebug = openDebugPanel;
  </script>
