  <script>
    /* Detect installed app (PWA / Android TWA) vs normal website, before first paint */
    (function () {
      var app = false;
      try {
        var q = new URLSearchParams(location.search);
        app = window.matchMedia('(display-mode: standalone)').matches ||
              window.matchMedia('(display-mode: fullscreen)').matches ||
              window.matchMedia('(display-mode: minimal-ui)').matches ||
              window.navigator.standalone === true ||
              (document.referrer || '').indexOf('android-app://') === 0 ||
              q.has('app_version') || q.get('source') === 'twa';
        if (app) sessionStorage.setItem('upscg_app', '1');
        else if (sessionStorage.getItem('upscg_app') === '1') app = true;
      } catch (e) {}
      if (app) document.documentElement.classList.add('app-mode');

  <script>
    (function () {
      var TARGET = 'homeUPSChub.html';
      var body = document.getElementById('introBody');
      var video = document.getElementById('introVideo');
      var bar = document.getElementById('progressBar');
      var soundBtn = document.getElementById('soundBtn');
      var go = false;

      function dest(extra) { return TARGET + window.location.search + (extra || window.location.hash); }

      function leave() {
        if (go) return; go = true;
        body.classList.add('page-exit');
        setTimeout(function () { window.location.replace(dest()); }, 450);
      }

      // Keep query (app_version etc.) on every link into the dashboard
      document.getElementById('enterBtn').href = dest('');
      document.getElementById('getAppBtn').href = TARGET + window.location.search + '#download';
      document.getElementById('enterBtn').addEventListener('click', function (e) { e.preventDefault(); leave(); });
      document.getElementById('skipBtn').addEventListener('click', leave);

      // Reduced motion → no autoplay intro
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        try { video.pause(); } catch (e) {}
        return;
      }

      video.addEventListener('ended', leave);
      video.addEventListener('timeupdate', function () {
        if (video.duration) bar.style.width = Math.min(100, (video.currentTime / video.duration) * 100) + '%';
      });

      // Safety nets: never get stuck on this page
      var card = document.querySelector('.video-card');
      var playBtn = document.getElementById('playBtn');
      var sources = ['images/intro.mp4', '/images/intro.mp4'];
      var tried = 0, started = false, iv = null;

      function tryPlay() {
        var p = video.play();
        if (p && p.catch) p.catch(function (err) {
          if (err && err.name === 'NotAllowedError') playBtn.hidden = false;   // autoplay blocked → tap to play
        });
      }
      function fallback() {                       // video unavailable → animated logo splash, then continue
        if (started || go || iv) return;
        card.classList.add('no-video');
        var t0 = Date.now(), total = 3600;
        iv = setInterval(function () {
          var pct = Math.min(100, ((Date.now() - t0) / total) * 100);
          bar.style.width = pct + '%';
          if (pct >= 100) { clearInterval(iv); leave(); }
        }, 80);
      }
      video.addEventListener('error', function () {
        tried++;
        if (tried < sources.length) { video.src = sources[tried]; video.load(); tryPlay(); }
        else fallback();
      });
      video.addEventListener('playing', function () {
        started = true; playBtn.hidden = true;
        if (iv) { clearInterval(iv); iv = null; card.classList.remove('no-video'); }
      });
      playBtn.addEventListener('click', function () { video.muted = true; tryPlay(); });
      setTimeout(function () { if (!started && !go && playBtn.hidden) tryPlay(); }, 1200);
      setTimeout(function () { if (!started && !go && playBtn.hidden) fallback(); }, 6000);
      setTimeout(leave, 45000);                   // hard cap

      // Optional sound toggle
      video.addEventListener('playing', function () { soundBtn.hidden = false; }, { once: true });
      soundBtn.addEventListener('click', function () {
        video.muted = !video.muted;
        soundBtn.textContent = video.muted ? '🔇' : '🔊';
        soundBtn.setAttribute('aria-label', video.muted ? 'Turn sound on' : 'Turn sound off');
      });
    })();
  </script>

  <!-- ====================== PRATYUSH DEBUG SYSTEM ====================== -->

  <script>
  const DEBUG_SECRET = "debug@2026";

  async function checkDebugStatus() {
    try {
      const res = await fetch('/debug-mode.json?t=' + Date.now());
      if (!res.ok) return false;
      const data = await res.json();
      return data.enabled === true;
    } catch (e) {
      return false;
    }
  }

  async function openDebugPanel() {
    const isAllowed = await checkDebugStatus();
    if (!isAllowed) {
      alert("Debug Mode is currently OFF.\nEnable it from PowerShell first.");
      return;
    }

    const code = prompt("Enter Debug Secret Code:");
    if (code !== DEBUG_SECRET) {
      alert("Access Denied");
      return;
    }

    if (document.getElementById("pratyush-debug-panel")) return;

    const panel = document.createElement("div");
    panel.id = "pratyush-debug-panel";
    panel.innerHTML = `
      <div style="
        position: fixed; bottom: 20px; right: 20px; z-index: 999999;
        background: #0a0a0a; color: #00ff88; padding: 18px; border-radius: 14px;
        font-family: monospace; font-size: 13px; width: 300px;
        box-shadow: 0 0 25px rgba(0,255,136,0.3); border: 1px solid #00ff88;">
        <div style="font-weight:bold; color:#00ffff; margin-bottom:10px;">
          🔧 DEBUG MODE ACTIVE
          <div style="font-size:11px; color:#888;">2026 @ Pratyush.dev inc</div>
        </div>
        <button onclick="copyFcmToken()" style="margin:4px 0; width:100%; padding:6px;">Copy FCM Token</button>
        <button onclick="location.reload()" style="margin:4px 0; width:100%; padding:6px;">Force Reload</button>
        <button onclick="document.getElementById('pratyush-debug-panel').remove()" style="margin:4px 0; width:100%; padding:6px;">Close Panel</button>
      </div>
    `;
    document.body.appendChild(panel);
  }

  function copyFcmToken() {
    const token = window.currentFcmToken || localStorage.getItem("fcmToken") || "No token found";
    navigator.clipboard.writeText(token);
    alert("FCM Token copied!");
  }

  document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "d") {
      openDebugPanel();
    }
  });

  window.enablePratyushDebug = openDebugPanel;
  </script>
