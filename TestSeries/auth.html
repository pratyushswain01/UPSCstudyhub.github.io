<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign In · UPSC Gurukul</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
            --apple-secondary: #86868b;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-border: #d2d2d7;
            --apple-radius: 18px;
        }

        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--apple-bg);
            color: var(--apple-text);
            letter-spacing: -0.015em;
        }

        .apple-card {
            background: var(--apple-card);
            border-radius: var(--apple-radius);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .apple-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            background: #f5f5f7;
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--apple-text);
            transition: all 0.2s ease;
            outline: none;
        }

        .apple-input:focus {
            background: #fff;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        .apple-btn {
            width: 100%;
            padding: 14px 24px;
            font-size: 17px;
            font-weight: 500;
            background: var(--apple-blue);
            color: white;
            border: none;
            border-radius: 980px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: -0.01em;
        }

        .apple-btn:hover {
            background: var(--apple-blue-hover);
            transform: scale(1.01);
        }

        .apple-btn:active {
            transform: scale(0.98);
        }

        .apple-link {
            color: var(--apple-blue);
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.15s;
        }

        .apple-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .logo {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--apple-text);
        }

        .logo span {
            color: var(--apple-blue);
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: var(--apple-secondary);
            margin-bottom: 6px;
            display: block;
        }
    </style>
</head>

<body>

    <div id="auth-view" class="flex items-center justify-center min-h-screen p-6">
        <div class="w-full max-w-[420px] mx-auto">
            <div class="text-center mb-10">
                <a href="index.html" class="logo">UPSC <span>Gurukul</span></a>
            </div>

            <div id="auth-container" class="apple-card p-10 transition-all duration-500">

                <div id="signin-form">
                    <h2 class="text-[28px] font-semibold text-center tracking-tight mb-2" style="color: var(--apple-text);">
                        Sign in
                    </h2>
                    <p class="text-center mb-10" style="color: var(--apple-secondary); font-size: 17px;">
                        Access your test dashboard
                    </p>

                    <form id="loginForm">
                        <div class="space-y-5">
                            <div>
                                <label for="login-email">Email</label>
                                <input type="email" id="login-email" required class="apple-input" placeholder="name@example.com">
                            </div>
                            <div>
                                <label for="login-password">Password</label>
                                <input type="password" id="login-password" required class="apple-input" placeholder="Enter your password">
                            </div>
                        </div>
                        <button type="submit" class="apple-btn mt-8">
                            Sign In
                        </button>
                    </form>

                    <p class="text-center text-[15px] mt-8" style="color: var(--apple-secondary);">
                        Don't have an account?
                        <a href="#" id="show-signup" class="apple-link">Create one</a>
                    </p>
                </div>

                <div id="signup-form" class="hidden">
                    <h2 class="text-[28px] font-semibold text-center tracking-tight mb-2" style="color: var(--apple-text);">
                        Create account
                    </h2>
                    <p class="text-center mb-10" style="color: var(--apple-secondary); font-size: 17px;">
                        Start your UPSC preparation
                    </p>

                    <form id="registerForm">
                        <div class="space-y-5">
                            <div>
                                <label for="signup-email">Email</label>
                                <input type="email" id="signup-email" required class="apple-input" placeholder="name@example.com">
                            </div>
                            <div>
                                <label for="signup-password">Password</label>
                                <input type="password" id="signup-password" required minlength="6" class="apple-input" placeholder="At least 6 characters">
                            </div>
                        </div>
                        <button type="submit" class="apple-btn mt-8">
                            Create Account
                        </button>
                    </form>

                    <p class="text-center text-[15px] mt-8" style="color: var(--apple-secondary);">
                        Already have an account?
                        <a href="#" id="show-signin" class="apple-link">Sign in</a>
                    </p>
                </div>

                <div id="message" class="mt-6 text-center text-[15px] font-medium"></div>
            </div>

            <p class="text-center text-[13px] mt-8" style="color: #a1a1a6;">
                Secure authentication powered by Firebase
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config - UNCHANGED
        const firebaseConfig = {
            apiKey: "AIzaSyBoPtr3d8se-fcGXkzixG8OE7dFvYjPcs4",
            authDomain: "upscstudyhub-github.firebaseapp.com",
            projectId: "upscstudyhub-github",
            storageBucket: "upscstudyhub-github.firebasestorage.app",
            messagingSenderId: "451692540885",
            appId: "1:451692540885:web:b425e85128e5de97c7c35c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 🔥 FIXED PATH
        const appId = "default-app-id";

        // AUTH STATE
        setPersistence(auth, browserLocalPersistence).then(() => {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    console.log("✅ User logged in:", user.uid);

                    try {
                        const userRef = doc(db, `artifacts/${appId}/users`, user.uid);

                        let snap = await getDoc(userRef);

                        if (!snap.exists()) {
                            console.log("🟡 Creating new user document...");

                            await setDoc(userRef, {
                                email: user.email,
                                isPremium: false,
                                createdAt: new Date()
                            });

                            console.log("✅ User document created:", user.uid);
                        } else {
                            console.log("✅ User document already exists");
                        }

                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect');

                        console.log("➡️ Redirecting...");
                        if (redirectUrl) {
                            window.location.href = redirectUrl;
                        } else {
                            window.location.href = "dashboard.html";
                        }
                    } catch (err) {
                        console.error("Error in auth state:", err);
                    }
                }
            });
        });

        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');

        // SIGNUP
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value.trim();

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                console.log("🟡 Signup success:", user.uid);

                const userRef = doc(db, `artifacts/${appId}/users`, user.uid);

                await setDoc(userRef, {
                    email: user.email,
                    isPremium: false,
                    createdAt: new Date()
                });

                console.log("✅ Firestore saved:", user.uid);

                displayMessage("Account created successfully!", "green");

            } catch (error) {
                console.error("🔥 Signup ERROR:", error);
                displayMessage(error.message, "red");
            }
        });

        // LOGIN
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            try {
                await signInWithEmailAndPassword(auth, email, password);
                console.log("🟡 Login success");
                displayMessage("Logging in...", "green");
            } catch (error) {
                console.error("🔥 Login ERROR:", error);
                displayMessage("Invalid email or password", "red");
            }
        });

        // UI message
        function displayMessage(msg, color) {
            messageDiv.textContent = msg;
            messageDiv.style.color = color === "green" ? "#34c759" : "#ff3b30";
        }

        // FORM TOGGLE
        const showSignup = document.getElementById("show-signup");
        const showSignin = document.getElementById("show-signin");
        const loginSection = document.getElementById("loginForm").parentElement;
        const registerSection = document.getElementById("registerForm").parentElement;

        if (showSignup && showSignin) {
            showSignup.addEventListener("click", (e) => {
                e.preventDefault();
                loginSection.classList.add("hidden");
                registerSection.classList.remove("hidden");
            });

            showSignin.addEventListener("click", (e) => {
                e.preventDefault();
                registerSection.classList.add("hidden");
                loginSection.classList.remove("hidden");
            });
        }
    </script>


<script src="/gurukul-mitra/study-supervisor.js?v=20261127-toast" defer></script>
</body>

</html>
